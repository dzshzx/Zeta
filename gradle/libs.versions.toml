[versions]
agp = "9.5.1"
kotlin = "2.4.21"
# COUI 2：ColorOS 17 风格的完整组件库（Miuix 的分支），https://github.com/suqi8/coui，源码在工作站 ~/workspace-external/coui
coui2 = "2.0.0"
activityCompose = "1.13.0"
androidx-lifecycle = "2.11.0"
androidx-navigationevent = "1.2.0"
intellijMarkdown = "0.7.18"
ratex = "0.1.16"
kotlinx-serialization = "1.13.0"
kotlinx-coroutines = "1.11.0"
# 健康连接的公开接口：search_personal 读步数、睡眠、心率等的汇总
healthConnect = "1.1.0"
desugarJdkLibs = "2.1.5"
# LSPosed 的现代模块接口（libxposed），只在编译时用，不打进 APK；手机上 LSPosed v2.2.1 加载 API 102 的模块
libxposedApi = "102.0.0"
junit = "4.13.2"
# 截图测试：Robolectric 在 JVM 上跑 Android（原生图形），Roborazzi 把 Compose 界面存成 PNG。
# compose-ui-test 不能写得比应用的 Compose 高（会把测试里的 Compose 一起抬高）；写低了 Gradle 按 Compose 的原子组约束自动抬到应用的版本。android-all 是 Robolectric 4.18 对 SDK 37 用的那份系统镜像。
robolectric = "4.18.1"
robolectric-android-all = "17-robolectric-16653203-i7"
roborazzi = "1.79.0"
compose-ui-test = "1.11.2"
# ui-test 1.11 带进来的 Espresso 3.5 调 InputManager.getInstance()，SDK 37 的镜像里已经没有这个方法，测试一跑就崩：app 里用版本约束抬到 3.7。
androidx-test-espresso = "3.7.0"
androidx-test-core = "1.7.0"

[libraries]
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
coui2-ui = { group = "io.github.suqi8.coui.kmp", name = "coui-ui-android", version.ref = "coui2" }
coui2-preference = { group = "io.github.suqi8.coui.kmp", name = "coui-preference-android", version.ref = "coui2" }
coui2-icons = { group = "io.github.suqi8.coui.kmp", name = "coui-icons-android", version.ref = "coui2" }
coui2-blur = { group = "io.github.suqi8.coui.kmp", name = "coui-blur-android", version.ref = "coui2" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-navigationevent = { group = "androidx.navigationevent", name = "navigationevent-compose", version.ref = "androidx-navigationevent" }
ratex-android = { group = "io.github.erweixin", name = "ratex-android", version.ref = "ratex" }
intellij-markdown = { group = "org.jetbrains", name = "markdown", version.ref = "intellijMarkdown" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
health-connect-client = { group = "androidx.health.connect", name = "connect-client", version.ref = "healthConnect" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
robolectric-android-all = { group = "org.robolectric", name = "android-all-instrumented", version.ref = "robolectric-android-all" }
roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose", version.ref = "roborazzi" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4", version.ref = "compose-ui-test" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidx-test-espresso" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidx-test-core" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }
libxposed-api = { group = "io.github.libxposed", name = "api", version.ref = "libxposedApi" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
