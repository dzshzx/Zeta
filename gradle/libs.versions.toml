[versions]
agp = "9.5.2"
# app 和 shared 共用的 Android SDK 版本。编译用 37.2：Miuix 要求依赖它的模块至少照 37.2 编译。
android-compileSdk = "37"
android-compileSdkMinor = "2"
android-minSdk = "35"
kotlin = "2.4.21"
# Miuix：HyperOS 风格的 Compose Multiplatform 组件库，https://github.com/compose-miuix-ui/miuix
miuix = "0.9.5-rc01"
activityCompose = "1.13.0"
androidx-lifecycle = "2.11.0"
androidx-navigationevent = "1.2.0"
intellijMarkdown = "0.7.18"
ratex = "0.1.16"
kotlinx-serialization = "1.13.0"
kotlinx-coroutines = "1.11.0"
# 健康连接的公开接口：search_personal 读步数、睡眠、心率等的汇总
healthConnect = "1.1.0"
# LSPosed 的现代模块接口（libxposed），只在编译时用，不打进 APK；手机上 LSPosed v2.2.1 加载 API 102 的模块
libxposedApi = "102.0.0"
# 只在测试里用：测试里的 SSH 服务器（Apache MINA SSHD）靠它认 Ed25519 密钥
bouncycastle = "1.87"
# shared/ 模块用的 Compose Multiplatform；在 Android 上映射到 androidx 的 Compose，版本跟 Miuix 用的一致
compose-multiplatform = "1.13.0-rc01"
junit = "4.13.2"
# 测试里的 SSH 服务器：在 JVM 里起一个，直连的远程主机连它
apache-sshd = "2.20.1"
# 截图测试：Robolectric 在 JVM 上跑 Android（原生图形），Roborazzi 把 Compose 界面存成 PNG。
# compose-ui-test 不能写得比应用的 Compose 高（会把测试里的 Compose 一起抬高）；写低了 Gradle 按 Compose 的原子组约束自动抬到应用的版本。android-all 是 Robolectric 4.18 对 SDK 37 用的那份系统镜像。
robolectric = "4.18.1"
robolectric-android-all = "17-robolectric-16653203-i7"
roborazzi = "1.79.0"
compose-ui-test = "1.11.2"
# ui-test 1.11 带进来的 Espresso 3.5 调 InputManager.getInstance()，SDK 37 的镜像里已经没有这个方法，测试一跑就崩：app 里用版本约束抬到 3.7。
androidx-test-espresso = "3.7.0"
androidx-test-core = "1.7.0"
# 只在测试里用：单元测试出字用的 ICU（android.icu 在不带 Robolectric 的测试里是空壳），跟 Robolectric 带进来的同一版
icu4j = "79.1"
# 构建时从运行时依赖生成第三方清单（组件、版本、许可证、上游地址）打进 assets，许可证不在 app/build.gradle.kts 的允许名单里就构建失败
licensee = "1.14.1"

[libraries]
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
miuix-ui = { group = "top.yukonga.miuix.kmp", name = "miuix-ui-android", version.ref = "miuix" }
miuix-preference = { group = "top.yukonga.miuix.kmp", name = "miuix-preference-android", version.ref = "miuix" }
miuix-icons = { group = "top.yukonga.miuix.kmp", name = "miuix-icons-android", version.ref = "miuix" }
miuix-blur = { group = "top.yukonga.miuix.kmp", name = "miuix-blur-android", version.ref = "miuix" }
miuix-glass = { group = "top.yukonga.miuix.kmp", name = "miuix-glass-android", version.ref = "miuix" }
miuix-glass-icons = { group = "top.yukonga.miuix.kmp", name = "miuix-glass-icons-android", version.ref = "miuix" }
# shared/ 模块按 Gradle 元数据取 Android 的变体
miuix-ui-kmp = { group = "top.yukonga.miuix.kmp", name = "miuix-ui", version.ref = "miuix" }
miuix-preference-kmp = { group = "top.yukonga.miuix.kmp", name = "miuix-preference", version.ref = "miuix" }
miuix-icons-kmp = { group = "top.yukonga.miuix.kmp", name = "miuix-icons", version.ref = "miuix" }
miuix-blur-kmp = { group = "top.yukonga.miuix.kmp", name = "miuix-blur", version.ref = "miuix" }
miuix-glass-kmp = { group = "top.yukonga.miuix.kmp", name = "miuix-glass", version.ref = "miuix" }
miuix-glass-icons-kmp = { group = "top.yukonga.miuix.kmp", name = "miuix-glass-icons", version.ref = "miuix" }
compose-mp-runtime = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "compose-multiplatform" }
compose-mp-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "compose-multiplatform" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-navigationevent = { group = "androidx.navigationevent", name = "navigationevent-compose", version.ref = "androidx-navigationevent" }
ratex-android = { group = "io.github.erweixin", name = "ratex-android", version.ref = "ratex" }
intellij-markdown = { group = "org.jetbrains", name = "markdown", version.ref = "intellijMarkdown" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
health-connect-client = { group = "androidx.health.connect", name = "connect-client", version.ref = "healthConnect" }
bcprov = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
apache-sshd-core = { group = "org.apache.sshd", name = "sshd-core", version.ref = "apache-sshd" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
robolectric-android-all = { group = "org.robolectric", name = "android-all-instrumented", version.ref = "robolectric-android-all" }
roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose", version.ref = "roborazzi" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4", version.ref = "compose-ui-test" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidx-test-espresso" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidx-test-core" }
icu4j = { group = "com.ibm.icu", name = "icu4j", version.ref = "icu4j" }
libxposed-api = { group = "io.github.libxposed", name = "api", version.ref = "libxposedApi" }

# Compose Multiplatform 带进来的多平台版生命周期（JetBrains 发布）：在 Android 上映射到 androidx 的那份，直接写上是为了把它对齐到 androidx-lifecycle 的版本
jetbrains-lifecycle-runtime-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
licensee = { id = "app.cash.licensee", version.ref = "licensee" }
