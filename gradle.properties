# 在手机上的 Debian 里构建：内存有限，Kotlin 编译放在 Gradle 进程内，不另起守护进程。
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.configuration-cache=true
org.gradle.workers.max=4
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Google 不提供 linux-arm64 的 aapt2；这里用官方 x86_64 版经 qemu-user 运行的包装脚本。
android.aapt2FromMavenOverride=/home/dzshzx/Android/aapt2-x86_64/aapt2
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
