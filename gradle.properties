# Kotlin 在 Gradle 守护进程里编译，不另起常驻的 Kotlin 守护进程；几棵任务树同时构建时内存峰值更低，速度不变
kotlin.compiler.execution.strategy=in-process
# 门禁冷构建 1g 也够，1.5g 留余量；手机 Debian 也用这一行
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
# 每个守护进程两 G 多，空闲 5 分钟就退出
org.gradle.daemon.idletimeout=300000
# 本地构建缓存：几棵任务树之间复用编译结果，新树不用从头编。测试结果不进缓存，见 app/build.gradle.kts
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
