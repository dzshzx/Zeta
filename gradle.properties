# Kotlin 在 Gradle 守护进程里编译，不另起 Kotlin 守护进程：守护进程本来就是热的，不变慢。
# 实测三个门禁同时冷跑，峰值 11.4 G；另起一个共用的 Kotlin 守护进程是 13.4 G，跑完还多留一个近 2 G 的进程。
kotlin.compiler.execution.strategy=in-process
# 堆 1.5g：单个门禁冷构建 1g 也能过，留点余量。手机 Debian 没在自己的 ~/.gradle/gradle.properties 里设堆，也用这一行
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
# 几棵任务树并行时同时有几个守护进程（每个两 G 多），空闲 5 分钟就退出，不长期占内存
org.gradle.daemon.idletimeout=300000
# 本地构建缓存：几棵任务树之间复用编译结果，新树不用从头编。测试结果不进缓存，见 app/build.gradle.kts
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
