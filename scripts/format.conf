# 本仓的格式化与检查配置，由 scripts/format.sh 读入（各项含义见那里）。
# Kotlin：ktfmt 排版，detekt 查函数认知复杂度，并计入行数上限。Go 的检查和「仓里没有 Python」的核对在 scripts/check.sh 里。
KOTLIN=1
# Kotlin 的工具（ktfmt、detekt）是 jar，用构建用的同一份 JDK 25：在这里找好，调用方不用自己传 JAVA_HOME。
JAVA_HOME=$(tools/java-home) && export JAVA_HOME
# 生成的 Kotlin 取字代码（helper/cmd/ktlocales，见 docs/i18n.md）：不排版也不查，每个键一个函数，行数随文字表涨；门禁另外重新生成一次核对
EXCLUDE=(':(exclude,glob)**/*.gen.kt')
# Swift（iOS 版 ios/）：SwiftLint 查（--strict），lizard 查函数圈复杂度；排版不另设工具，照 SwiftLint 的规则。编译和测试只在 macOS 上（.github/workflows/ios.yml）。
SWIFTLINT=1
LIZARD=(swift)
