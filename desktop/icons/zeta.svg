<!-- Zeta 桌面版图标的源头：照手机启动图标（app/src/main/res/drawable/ic_launcher_*.xml）画成圆角方块。
     zeta.ico 和窗口用的 zeta.png 由 desktop/icons/render.sh 从它生成，改了这里就重跑那个脚本。 -->
