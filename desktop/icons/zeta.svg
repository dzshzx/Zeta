      <stop offset="1" stop-color="#0F5FEE"/>
    </linearGradient>
    <radialGradient id="shine" cx="38" cy="32" r="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.24"/>
