    </radialGradient>
    <linearGradient id="stroke" x1="54" y1="32.72" x2="54" y2="75.92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9E8FF"/>
