    <path d="M43.12,33.52 L63.12,33.52 C51.12,39.52 44.32,47.12 44.32,55.12 C44.32,61.52 49.12,64.72 56.32,64.72 C61.92,64.72 64.72,67.52 63.76,70.8 C62.96,73.52 59.6,74.96 55.44,74" stroke="url(#stroke)"/>
