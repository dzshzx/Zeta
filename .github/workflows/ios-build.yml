name: iOS 构建

# 打 iOS 版的不签名 ipa、在模拟器里截首屏（简体中文、英文各一张），共用的步骤在 ios.yml；只手动跑：
#   gh workflow run ios-build.yml --ref <分支>
# ipa 和截图在这次运行的 artifacts 里；在 master 上跑的另发预构建版本。编译和测试由 ios-ci.yml 在推送时跑，这里不再跑测试。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/ios.yml
    with:
      steps: simulator ipa

  # master 上的构建发成预发布版本 ios-dev-<提交号>，不用登录就能下载；全部 iOS 预构建：
  #   https://github.com/dzshzx/Zeta/releases?q=ios-dev&expanded=true
  # 仓库开着不可变发布：发布后不能再加文件、不能挪 tag，所以每次一个新版本，先建草稿传好 ipa 再发布。
  # tag 不以 v 开头，版本号算法（tools/version.sh）和发版都不认它；标成预发布，不算最新版，应用内更新照旧。
  prerelease:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 取 ipa
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ipa
          path: ipa

      - name: 发预发布版本
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          src=$(ls ipa/*.ipa)
          name=$(basename "$src" .ipa)
          tag=ios-dev-${SHA:0:7}
          notes="iOS 测试版的预构建（${name#Zeta-}，提交 ${SHA:0:7}）。不签名，用自己的开发者账号重签后安装。说明见 docs/ios.md。"
          gh release create "$tag" --draft --target "$SHA" --prerelease --latest=false --title "iOS 预构建 ${name#Zeta-}" --notes "$notes"
          gh release upload "$tag" "$src"
          gh release edit "$tag" --draft=false
