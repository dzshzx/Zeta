name: Desktop

# 桌面版的 Windows 安装包（MSI），全在 Linux 上打：tools/gradle :desktop:packageWindows（配 Windows 的 JRE、用 wixl 打包，
# 见 desktop/windows/package.sh）。打出来的包未做代码签名，第一次运行时 Windows 的 SmartScreen 会提示。
# 默认在本机 runner 上（它的主机装着 wixl）；本机 runner 不在线时 runner=github-hosted 改到 ubuntu-latest，在那里现装 wixl。
# 手动跑一次，包在本次运行的 desktop 构件里：
#   gh workflow run desktop.yml --ref master
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 跑在哪：self-hosted 是本机 runner，github-hosted 是 ubuntu-latest
        type: choice
        options: [self-hosted, github-hosted]
        default: self-hosted

permissions:
  contents: read

jobs:
  msi:
    runs-on: ${{ inputs.runner == 'github-hosted' && 'ubuntu-latest' || fromJSON('["self-hosted","nerv"]') }}
    timeout-minutes: 40
    steps:
      - name: 每个 job 用新的 HOME
        run: mkdir -p "$RUNNER_TEMP/home" && echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"

      - name: 检出
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # 版本号从 git 推出（根目录的 build.gradle.kts）
          persist-credentials: false

      - name: 安装 JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: ${{ runner.environment == 'github-hosted' && 'gradle' || '' }}

      # 装进包里、在 Linux 主机上跑的 zeta-helper 和 claude-switch 要编
      - name: 安装 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: helper/go.mod
          cache: false

      - name: 托管机上装 wixl
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq wixl

      - name: 打 MSI
        run: tools/gradle --console=plain :desktop:packageWindows

      - name: 上传安装包
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop
          path: desktop/build/windows/*.msi
          if-no-files-found: error
          retention-days: 7
