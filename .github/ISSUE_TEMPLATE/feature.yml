name: 想要的功能
description: 建议加一个功能或改一个现有的做法
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: 想做什么
      description: 想用 Zeta 做成什么事，现在卡在哪里
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 设想的做法
      description: 希望 Zeta 怎么做；有参照（别的应用或 Code Agent 自身的功能）也写上
  - type: input
    id: version
    attributes:
      label: Zeta 版本
      description: 设置 › 关于 里的「版本名（versionCode）」
      placeholder: 0.7.1（110）
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备与系统版本
      description: 平台（Windows / Android / iOS）、设备型号与系统版本
      placeholder: Windows 11 24H2 / Xiaomi 17，Android 16，HyperOS 3.0.5 / iPhone，iOS 27
    validations:
      required: true
  - type: input
    id: root
    attributes:
      label: root 方案（仅 Android 本机功能相关时填写）
      description: KernelSU、SukiSU、Magisk 等；用了 LSPosed 也写上；Windows / iOS 或仅远程开发场景可留空
      placeholder: KernelSU v1.0.5
    validations:
      required: false
