# XcodeGen 的工程描述：scripts/build.sh 每次照它生成 Zeta.xcodeproj（不进 Git）。
name: Zeta
options:
  bundleIdPrefix: com.dzshzx
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ZETA_DISPLAY_NAME: Zeta Dev
    # 正式版、测试版的包名由 scripts/build.sh 经 ZETA_BUNDLE_ID 定；扩展的包名是它加 .activity，所以不在命令行上直接改 PRODUCT_BUNDLE_IDENTIFIER
    ZETA_BUNDLE_ID: com.dzshzx.zeta.dev
    PRODUCT_BUNDLE_IDENTIFIER: $(ZETA_BUNDLE_ID)
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Zeta:
    type: application
    platform: iOS
    sources:
      - path: Zeta
      - path: Shared
    dependencies:
      - framework: build/ZetaCore.xcframework
        embed: false
      - target: ZetaActivity
        embed: true
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
      - sdk: libresolv.tbd
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: $(ZETA_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans, en]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: Zeta 经 SSH 连局域网里的设备，连接其上的 Code Agent。
        NSPhotoLibraryAddUsageDescription: 看大图时把图片保存到相册。
        NSCameraUsageDescription: 在输入栏里拍照，作为附件发给 Code Agent。
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: $(ZETA_BUNDLE_ID)
            CFBundleURLSchemes: [$(ZETA_BUNDLE_ID)]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: [-lresolv]
  ZetaActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: ZetaActivity
      - path: Shared
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: build/ActivityInfo.plist
      properties:
        CFBundleDisplayName: $(ZETA_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        ZetaURLScheme: $(ZETA_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ZETA_BUNDLE_ID).activity
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
  ZetaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ZetaTests
    dependencies:
      - target: Zeta
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dzshzx.zeta.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Zeta:
    build:
      targets:
        Zeta: all
    test:
      targets:
        - ZetaTests
